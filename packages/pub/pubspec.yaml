repository: https://github.com/nbkdevs/imc-calculadora/tree/main/packages/pub
issue_tracker: https://github.com/nbkdevs/imc-calculadora/issues
topics:
  - bmi
  - health
  - calculator
  - fitness

environment:
  sdk: ^3.0.0

executables:
  imc_calculadora:

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
